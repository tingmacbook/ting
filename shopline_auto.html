(let x of inv.items){let s=shop.get(x.sku);if(x.newItem)newer.push(x);if(x.should&&!s)missing.push(x);if(s&&s.online&&!x.should)reverse.push({...x,sl:s});if(s&&s.qty!==x.qty)qty.push({...x,sl:s,diff:x.qty-s.qty});if(s&&s.online&&!x.canPreorder&&s.preorder)pre.push({...x,sl:s});if(s&&s.qty===x.qty)ok.push({...x,sl:s})}return{inv,missing,reverse,qty,newer,pre,ok,preOk:payload.preorder_field_seen!==false}}function showTab(t){tab=t;$('tabA').classList.toggle('on',t==='apple');$('tabC').classList.toggle('on',t==='acc');$('apple').classList.toggle('hide',t!=='apple');$('acc').classList.toggle('hide',t!=='acc');$('status').textContent=(data.res[t]?t==='apple'?'主機已更新':'配件已更新':'尚未更新')}function render(){renderApple();renderAcc();showTab(tab)}function sourceHtml(kind,r){let left=kind==='apple'?`${r.inv.raw} 列 / ${r.inv.sell} 台可賣 / ${r.inv.items.length} ERP`:`${r.inv.raw} 列 / ${r.inv.items.length} SKU`;return `<div class="source"><div class="metric"><div><div class="t">${kind==='apple'?'主機庫存表':'配件庫存表'} Google Sheets</div><div class="v">${left}</div></div></div><div class="metric"><div><div class="t">SHOPLINE 即時 API</div><div class="v">${data.shop?data.shop.size:0} 個 SKU</div></div></div></div>`}function cards(arr){return `<div class="cards">${arr.map(c=>`<div class="card ${c.cls}"><b>${c.n}</b><span>${c.t}</span></div>`).join('')}</div>`}function panel(cls,tag,title,count,head,rows,empty){return `<div class="panel ${cls} open"><div class="ph" onclick="this.parentNode.classList.toggle('open')"><span class="tag">${tag}</span><span class="title">${title}</span><span class="count">${count}</span><span>▼</span></div><div class="body"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}" style="text-align:center;color:#667085;padding:26px">${empty}</td></tr>`}</tbody></table></div></div>`}function renderApple(){let r=data.res.apple;if(!r){$('apple').innerHTML=sourceHtml('apple',{inv:{raw:0,sell:0,items:[]}});return}$('apple').innerHTML=sourceHtml('apple',r)+cards([{cls:'warn',n:r.fix.length,t:'需調整數量'},{cls:'pink',n:r.price.length,t:'價格不符'},{cls:'info',n:r.newer.length,t:'待上架規格'},{cls:'bad',n:r.reverse.length,t:'電商已標記卻找不到'},{cls:'ok',n:r.ok.length,t:'數量已一致'}])+panel('warn','需調整','數量有差異，需更新 Shopline',r.fix.length+' 筆',['ERP條碼','商品名稱','款式','SHOPLINE 目前數量','庫存可賣台數','差異','建議填入增減數量'],r.fix.map(x=>row([sku(x.sku),esc(x.name),esc(x.vari),x.sl.qty,x.qty,diff(x.diff),diff(x.diff)])),'無需調整項目')+panel('pink','價格不符','Shopline 特價與庫存進階售價不一致',r.price.length+' 筆',['ERP條碼','商品名稱','款式','SHOPLINE 特價','庫存進階售價','差異'],r.price.map(x=>row([sku(x.sku),esc(x.name),esc(x.vari),moneyFmt(x.sl.price),moneyFmt(x.price),diff(x.diff)])),'所有特價與庫存一致')+panel('info','待上架','庫存可賣，Shopline 尚未建立',r.newer.length+' 個規格',['ERP條碼','商品名稱','款式','可賣台數'],r.newer.map(x=>row([sku(x.sku),esc(x.name),esc(x.vari),x.qty])),'所有規格已上架')+panel('bad','反向排查','庫存表已標記 Shopline 電商，但 Shopline 後台找不到',r.reverse.length+' 個規格',['ERP條碼','商品名稱','款式','可賣台數','SHOPLINE狀態'],r.reverse.map(x=>row([sku(x.sku),esc(x.name),esc(x.vari),x.qty,esc(x.sl.status)])),'無標記異常')+panel('ok','正確','Shopline 數量已與庫存表一致',r.ok.length+' 筆',['ERP條碼','商品名稱','款式','數量'],r.ok.map(x=>row([sku(x.sku),esc(x.name),esc(x.vari),x.qty])),'目前沒有一致項目')}function renderAcc(){let r=data.res.acc;if(!r){$('acc').innerHTML=sourceHtml('acc',{inv:{raw:0,items:[]}});return}$('acc').innerHTML=sourceHtml('acc',r)+cards([{cls:'warn',n:r.newer.length,t:'新品未上架'},{cls:'bad',n:r.missing.length,t:'shopline找不到'},{cls:'warn',n:r.reverse.length,t:'配件表狀態需調'},{cls:'info',n:r.qty.length,t:'數量不符'},{cls:'violet',n:r.preOk?r.pre.length:'--',t:r.preOk?'預購問題':'預購欄未回傳'}])+panel('warn','新品未上架','配件表「電商平台上架」標示為新品未上架或新品待上架',r.newer.length+' 筆',['產品編號/條碼','商品名稱','分頁','辦公室＋大安庫存'],r.newer.map(x=>row([sku(x.sku),esc(x.name),esc(x.sheet),x.qty])),'無新品未上架')+panel('bad','shopline找不到','配件表標示 Shopline線上，但 Shopline 找不到',r.missing.length+' 筆',['產品編號/條碼','商品名稱','分頁','辦公室＋大安庫存'],r.missing.map(x=>row([sku(x.sku),esc(x.name),esc(x.sheet),x.qty])),'無缺漏')+panel('warn','配件表狀態需調','Shopline 網店有上架，但配件表未標示 Shopline線上',r.reverse.length+' 筆',['產品編號/條碼','商品名稱','分頁','SHOPLINE數量','辦公室＋大安'],r.reverse.map(x=>row([sku(x.sku),esc(x.name),esc(x.sheet),x.sl.qty,x.qty])),'無異常')+panel('info','數量不符','Shopline 數量與配件表辦公室＋大安庫存不一致',r.qty.length+' 筆',['產品編號/條碼','商品名稱','SHOPLINE數量','辦公室＋大安','差異'],r.qty.map(x=>row([sku(x.sku),esc(x.name),x.sl.qty,x.qty,diff(x.diff)])),'全部一致')+panel('violet','預購問題','網店上架中，但商品不可叫貨卻開啟預購',r.preOk?r.pre.length+' 筆':'0 筆',['產品編號/條碼','商品名稱','是否停產/公司狀態','SHOPLINE數量','辦公室＋大安'],r.preOk?r.pre.map(x=>row([sku(x.sku),esc(x.name),esc(x.co),x.sl.qty,x.qty])):[],'SHOPLINE API 尚未回傳預購欄位，請更新 Cloudflare Worker')}function row(c){return '<tr>'+c.map(x=>'<td>'+x+'</td>').join('')+'</tr>'}function sku(s){return '<span class="sku">'+esc(s)+'</span>'}function diff(n){n=Number(n)||0;return '<span class="mono '+(n>=0?'plus':'minus')+'">'+(n>0?'+':'')+n+'</span>'}function moneyFmt(n){return '$'+Math.round(num(n)).toLocaleString()}function showErr(m){$('err').textContent=m;$('err').style.display='block'}function hideErr(){$('err').style.display='none'}function downloadCSV(){let r=data.res[tab];if(!r)return;let out='區塊,SKU,商品名稱,數量\n';let lists=tab==='apple'?{需調整:r.fix,價格不符:r.price,待上架:r.newer,反向排查:r.reverse,正確:r.ok}:{新品未上架:r.newer,shopline找不到:r.missing,配件表狀態需調:r.reverse,數量不符:r.qty,預購問題:r.pre};for(let [k,arr] of Object.entries(lists))for(let x of arr)out+=`${k},"${x.sku}","${(x.name||'').replace(/"/g,'""')}","${x.qty??''}"\n`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv'}));a.download='shopline_auto_'+tab+'.csv';a.click()}render();</script></body></html>
